name: Cloudflare Deploy (Sınırsız)
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build for Cloudflare
        run: npx @opennextjs/cloudflare@latest build
      - name: Deploy to Cloudflare (Wrangler v3 - stable)
        run: npx wrangler@3.114.1 deploy --config .open-next/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
