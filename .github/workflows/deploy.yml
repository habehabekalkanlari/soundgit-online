name: Cloudflare Deploy (Sınırsız)
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build for Cloudflare
        run: npx @opennextjs/cloudflare@latest build
      - name: List build output (debug)
        run: ls -la .open-next/ && find .open-next -maxdepth 2 -type f | head -30
      - name: Deploy to Cloudflare
        run: npx wrangler@4.156.0 deploy .open-next/worker.js --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
