name: Cloudflare Deploy (Sınırsız)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx @opennextjs/cloudflare@latest build
      - name: Deploy with Wrangler v3
        run: npx wrangler@3.114.1 deploy .open-next/worker.js --config wrangler.toml --compatibility-date 2024-12-01
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
